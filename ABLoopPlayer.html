<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>ABループプレイヤー</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #111; color: #eee; font-family: "Segoe UI", "Yu Gothic UI", sans-serif;
    display: flex; flex-direction: column; height: 100vh; overflow: hidden;
    user-select: none; -webkit-user-select: none;
  }
  header {
    display: flex; align-items: center; gap: 10px; padding: 8px 12px; background: #1b1b1b;
    border-bottom: 1px solid #333;
  }
  header .title { font-weight: bold; color: #f5820b; white-space: nowrap; }
  #fileName { color: #aaa; font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  #dropHint {
    flex: 1; display: flex; align-items: center; justify-content: center; color: #888;
    font-size: 18px; border: 2px dashed #444; margin: 16px; border-radius: 10px; text-align: center; padding: 20px;
  }
  #videoWrap { flex: 1; display: none; align-items: center; justify-content: center; background: #000; min-height: 0; }
  video { max-width: 100%; max-height: 100%; }
  body.dragging { outline: 3px solid #f5820b; outline-offset: -3px; }
  .controls { background: #1b1b1b; border-top: 1px solid #333; padding: 10px 12px 12px; }
  #seekBar {
    position: relative; height: 26px; background: #2a2a2a; border-radius: 4px; cursor: pointer; margin-bottom: 10px;
  }
  #abRegion { position: absolute; top: 0; bottom: 0; background: rgba(245,130,11,.45); display: none; }
  #played { position: absolute; top: 0; bottom: 0; left: 0; width: 0%; background: #f5820b; border-radius: 4px 0 0 4px; opacity: .85; }
  .marker {
    position: absolute; top: -4px; bottom: -4px; width: 16px; margin-left: -8px; display: none;
    align-items: flex-start; justify-content: center; pointer-events: none;
  }
  .marker span {
    background: #fff; color: #111; font-size: 11px; font-weight: bold; width: 16px; height: 16px;
    border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid #f5820b;
  }
  .marker::after { content: ""; position: absolute; top: 16px; bottom: 0; width: 2px; background: #fff; }
  #playhead {
    position: absolute; top: -3px; bottom: -3px; width: 10px; margin-left: -5px; background: #fff;
    border-radius: 3px; left: 0%; pointer-events: none; box-shadow: 0 0 4px #000;
  }
  .row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  button {
    background: #2e2e2e; color: #eee; border: 1px solid #4a4a4a; border-radius: 6px;
    padding: 7px 12px; font-size: 14px; cursor: pointer; white-space: nowrap;
  }
  button:hover { background: #3d3d3d; }
  button.active { background: #f5820b; border-color: #f5820b; color: #111; font-weight: bold; }
  button.ab { border-color: #f5820b; }
  .time { font-variant-numeric: tabular-nums; font-size: 14px; color: #ddd; white-space: nowrap; }
  .abTime { font-variant-numeric: tabular-nums; font-size: 13px; color: #f5a54b; min-width: 118px; display: inline-block; }
  .mini { padding: 7px 7px; font-size: 12px; }
  select {
    background: #2e2e2e; color: #eee; border: 1px solid #4a4a4a; border-radius: 6px; padding: 6px; font-size: 14px;
  }
  .spacer { flex: 1; }
  .help { color: #777; font-size: 12px; margin-top: 8px; line-height: 1.6; }
  #loopCount { color: #f5a54b; font-size: 13px; white-space: nowrap; }
</style>
</head>
<body>
<header>
  <span class="title">ABループプレイヤー</span>
  <button id="openBtn">ファイルを開く</button>
  <span id="fileName">動画ファイルをドラッグ＆ドロップでも開けます</span>
  <input type="file" id="fileInput" accept="video/*,audio/*" hidden>
</header>
<div id="dropHint">ここに動画ファイルをドロップ<br>（mp4 / webm など、ブラウザが再生できる形式）</div>
<div id="videoWrap"><video id="video"></video></div>
<div class="controls">
  <div id="seekBar">
    <div id="abRegion"></div>
    <div id="played"></div>
    <div class="marker" id="markerA"><span>A</span></div>
    <div class="marker" id="markerB"><span>B</span></div>
    <div id="playhead"></div>
  </div>
  <div class="row">
    <button id="playBtn" title="Space">▶ 再生</button>
    <span class="time"><span id="curTime">0:00.0</span> / <span id="durTime">0:00.0</span></span>
    <span class="spacer"></span>
    <span id="loopCount"></span>
  </div>
  <div class="row" style="margin-top:8px;">
    <button class="ab" id="setA">Aを設定</button>
    <button class="mini" id="aMinus" title="Aを0.1秒戻す">A-0.1</button>
    <button class="mini" id="aPlus" title="Aを0.1秒進める">A+0.1</button>
    <span class="abTime">A: <span id="aTime">--</span></span>
    <button class="ab" id="setB">Bを設定</button>
    <button class="mini" id="bMinus" title="Bを0.1秒戻す">B-0.1</button>
    <button class="mini" id="bPlus" title="Bを0.1秒進める">B+0.1</button>
    <span class="abTime">B: <span id="bTime">--</span></span>
    <button id="loopBtn">ループ: OFF</button>
    <button id="clearBtn">ABクリア</button>
  </div>
  <div class="row" style="margin-top:8px;">
    <span>速度</span>
    <select id="speed">
      <option value="0.25">0.25x</option>
      <option value="0.5">0.5x</option>
      <option value="0.75">0.75x</option>
      <option value="1" selected>1.0x</option>
      <option value="1.25">1.25x</option>
      <option value="1.5">1.5x</option>
      <option value="2">2.0x</option>
    </select>
    <button id="back5">-5秒</button>
    <button id="fwd5">+5秒</button>
    <button id="fsBtn">全画面</button>
  </div>
  <div class="help">
    ショートカット: Space=再生/停止 / ←→=5秒移動 / Shift+←→=1コマ移動 / A, B=A点・B点を設定 / L=ループ切替 / ↑↓=速度 / F=全画面
  </div>
</div>
<script>
const $ = (id) => document.getElementById(id);
const video = $("video");
let pointA = null, pointB = null, loopOn = false, loopCounter = 0;

function fmt(t) {
  if (t == null || isNaN(t)) return "--";
  const m = Math.floor(t / 60), s = t - m * 60;
  return m + ":" + s.toFixed(1).padStart(4, "0");
}
function loadFile(file) {
  if (!file) return;
  const url = URL.createObjectURL(file);
  video.src = url;
  $("fileName").textContent = file.name;
  $("dropHint").style.display = "none";
  $("videoWrap").style.display = "flex";
  clearAB();
  video.play().catch(() => {});
}
$("openBtn").addEventListener("click", () => $("fileInput").click());
$("fileInput").addEventListener("change", (e) => loadFile(e.target.files[0]));
window.addEventListener("dragover", (e) => { e.preventDefault(); document.body.classList.add("dragging"); });
window.addEventListener("dragleave", () => document.body.classList.remove("dragging"));
window.addEventListener("drop", (e) => {
  e.preventDefault(); document.body.classList.remove("dragging");
  const f = e.dataTransfer.files && e.dataTransfer.files[0];
  if (f) loadFile(f);
});
function togglePlay() {
  if (!video.src) return;
  if (video.paused) { video.play().catch(() => {}); } else { video.pause(); }
}
$("playBtn").addEventListener("click", togglePlay);
video.addEventListener("play", () => { $("playBtn").textContent = "⏸ 一時停止"; });
video.addEventListener("pause", () => { $("playBtn").textContent = "▶ 再生"; });
video.addEventListener("loadedmetadata", () => { $("durTime").textContent = fmt(video.duration); drawSeek(); });

function drawSeek() {
  const d = video.duration;
  if (!d || isNaN(d)) return;
  const pct = (t) => (t / d * 100) + "%";
  $("played").style.width = pct(video.currentTime);
  $("playhead").style.left = pct(video.currentTime);
  $("curTime").textContent = fmt(video.currentTime);
  const region = $("abRegion");
  if (pointA != null && pointB != null) {
    region.style.display = "block";
    region.style.left = pct(pointA);
    region.style.width = ((pointB - pointA) / d * 100) + "%";
  } else { region.style.display = "none"; }
  const mA = $("markerA"), mB = $("markerB");
  if (pointA != null) { mA.style.display = "flex"; mA.style.left = pct(pointA); } else { mA.style.display = "none"; }
  if (pointB != null) { mB.style.display = "flex"; mB.style.left = pct(pointB); } else { mB.style.display = "none"; }
}
function tick() {
  if (loopOn && pointA != null && pointB != null && !video.paused) {
    if (video.currentTime >= pointB) {
      video.currentTime = pointA;
      loopCounter++;
      $("loopCount").textContent = "ループ回数: " + loopCounter;
    }
  }
  drawSeek();
  requestAnimationFrame(tick);
}
requestAnimationFrame(tick);

const seekBar = $("seekBar");
let seeking = false;
function seekToEvent(e) {
  const r = seekBar.getBoundingClientRect();
  const ratio = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
  if (video.duration) video.currentTime = ratio * video.duration;
}
seekBar.addEventListener("pointerdown", (e) => { seeking = true; seekBar.setPointerCapture(e.pointerId); seekToEvent(e); });
seekBar.addEventListener("pointermove", (e) => { if (seeking) seekToEvent(e); });
seekBar.addEventListener("pointerup", () => { seeking = false; });

function setA() {
  if (!video.src) return;
  pointA = video.currentTime;
  if (pointB != null && pointA >= pointB) pointB = null;
  if (pointA != null && pointB != null) setLoop(true);
  updateAB();
}
function setB() {
  if (!video.src) return;
  pointB = video.currentTime;
  if (pointA != null && pointB <= pointA) pointA = null;
  if (pointA != null && pointB != null) setLoop(true);
  updateAB();
}
function nudge(which, delta) {
  const d = video.duration || 0;
  if (which === "a" && pointA != null) {
    pointA = Math.min(d, Math.max(0, pointA + delta));
    if (pointB != null && pointA >= pointB) pointA = pointB - 0.1;
  }
  if (which === "b" && pointB != null) {
    pointB = Math.min(d, Math.max(0, pointB + delta));
    if (pointA != null && pointB <= pointA) pointB = pointA + 0.1;
  }
  updateAB();
}
function updateAB() {
  $("aTime").textContent = fmt(pointA);
  $("bTime").textContent = fmt(pointB);
  drawSeek();
}
function setLoop(on) {
  loopOn = on;
  loopCounter = 0;
  $("loopCount").textContent = on ? "ループ回数: 0" : "";
  const btn = $("loopBtn");
  btn.textContent = "ループ: " + (on ? "ON" : "OFF");
  btn.classList.toggle("active", on);
}
function clearAB() {
  pointA = null; pointB = null; setLoop(false); updateAB();
}
$("setA").addEventListener("click", setA);
$("setB").addEventListener("click", setB);
$("aMinus").addEventListener("click", () => nudge("a", -0.1));
$("aPlus").addEventListener("click", () => nudge("a", 0.1));
$("bMinus").addEventListener("click", () => nudge("b", -0.1));
$("bPlus").addEventListener("click", () => nudge("b", 0.1));
$("loopBtn").addEventListener("click", () => {
  if (pointA == null || pointB == null) { alert("先にA点とB点を設定してください"); return; }
  setLoop(!loopOn);
});
$("clearBtn").addEventListener("click", clearAB);
$("speed").addEventListener("change", (e) => { video.playbackRate = parseFloat(e.target.value); });
$("back5").addEventListener("click", () => { video.currentTime = Math.max(0, video.currentTime - 5); });
$("fwd5").addEventListener("click", () => { video.currentTime = Math.min(video.duration || 0, video.currentTime + 5); });
$("fsBtn").addEventListener("click", () => {
  const w = $("videoWrap");
  if (document.fullscreenElement) { document.exitFullscreen(); }
  else if (w.requestFullscreen) { w.requestFullscreen(); }
});
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
  const speeds = [0.25, 0.5, 0.75, 1, 1.25, 1.5, 2];
  switch (e.key) {
    case " ": e.preventDefault(); togglePlay(); break;
    case "ArrowLeft":
      e.preventDefault();
      video.currentTime = Math.max(0, video.currentTime - (e.shiftKey ? 1 / 30 : 5)); break;
    case "ArrowRight":
      e.preventDefault();
      video.currentTime = Math.min(video.duration || 0, video.currentTime + (e.shiftKey ? 1 / 30 : 5)); break;
    case "ArrowUp": {
      e.preventDefault();
      const i = speeds.indexOf(video.playbackRate);
      const n = speeds[Math.min(speeds.length - 1, (i < 0 ? 3 : i) + 1)];
      video.playbackRate = n; $("speed").value = String(n); break;
    }
    case "ArrowDown": {
      e.preventDefault();
      const i = speeds.indexOf(video.playbackRate);
      const n = speeds[Math.max(0, (i < 0 ? 3 : i) - 1)];
      video.playbackRate = n; $("speed").value = String(n); break;
    }
    case "a": case "A": setA(); break;
    case "b": case "B": setB(); break;
    case "l": case "L": $("loopBtn").click(); break;
    case "f": case "F": $("fsBtn").click(); break;
  }
});
</script>
</body>
</html>
